# Alembic configuration (CDX-013).
#
# Invoked by the stacks' hummingbot-api-migrate service as a bare
# `alembic upgrade head` with CWD=/hummingbot-api and DATABASE_URL in the
# environment ("hummingbot stack - no vpn":227-229 / "- vpn":347-349), so:
#   * this file MUST live at the repo root (the image's /hummingbot-api), and
#   * sqlalchemy.url is deliberately left EMPTY here — alembic/env.py resolves
#     the URL from the application settings (config.settings.database.url,
#     which reads DATABASE_URL). Keeping the URL out of this file also keeps
#     credentials off disk and avoids ConfigParser interpolation mangling a
#     password containing '%'.
[alembic]
# %(here)s = this file's directory, so the scaffold resolves the same whether
# alembic is invoked by the migrate service (CWD=/hummingbot-api), by a human
# from elsewhere, or by the API process's own startup check.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Alembic 1.18 splits multi-value paths on this; without it it falls back to
# legacy splitting (on spaces/commas/colons) and warns — a Windows path or a
# colon in a path would be mangled.
path_separator = os

# Resolved by env.py from the app settings / DATABASE_URL. Do not set here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
